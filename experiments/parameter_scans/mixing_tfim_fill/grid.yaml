# mixing_tfim_fill at the tuned gamma.
# An encoding- and coupling-strength scan at n = 6, d = 2, with gamma taken from the
# holdout hyperparameter study rather than chosen by hand: 4.0 is 4.278280 rounded to
# the nearest integer -- the gamma of the best trial at n = 6, d = 2 in
# experiments/hyperparameter_studies/optuna_mixing_tfim_fill/, whose run 0903012719
# is what Figure 2 plots. See README.md.
name: mixing_capacity_qrc_tilted_tfim
axes:
  - n: {values: [6]}
  - d: {values: [2]}
  - encoding_mode: {values: [fill]}
  - dt: {values: [1.0]}
  - encoding_strength: {logspace: [-4, 0, 13]}
  - coupling_strength: {logspace: [-5, 1, 19]}
  - gamma: {values: [4.0]}
  - seed: {range: 20}
